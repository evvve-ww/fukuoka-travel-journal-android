
name: Build Fukuoka Travel APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Fukuoka_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract travel project
        run: |
          mkdir extracted www
          unzip -q Fukuoka_Android_Project.zip -d extracted
          HTML=$(find extracted -type f -name index.html | head -n 1)
          if [ -z "$HTML" ]; then
            echo "index.html not found"
            exit 1
          fi
          ROOT=$(dirname "$HTML")
          cp -R "$ROOT"/. www/

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lynn.fukuokatravel",
            "appName": "福冈旅行手帐",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fukuoka-Travel-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
